name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar Release com esta tag (ex.: v0.2.0). Vazio = só compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hora-do-desenho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hora-do-desenho-apk
          path: hora-do-desenho.apk

      - name: Publish release (tags v* ou disparo manual com release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Hora do Desenho ${{ inputs.release_tag || github.ref_name }}
          files: hora-do-desenho.apk
          generate_release_notes: true
