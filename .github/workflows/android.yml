name: Android APK

on:
  push:
    branches: [main, "fix/**", "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar Release com esta tag (ex.: v0.2.0). Vazio = só compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          if "<script>" not in source or "</script>" not in source:
              raise SystemExit("Embedded application script not found")
          script = source.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/hora-do-desenho.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/hora-do-desenho.js

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hora-do-desenho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hora-do-desenho-apk
          path: hora-do-desenho.apk

      - name: Publish release (tags v* ou disparo manual com release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Hora do Desenho ${{ inputs.release_tag || github.ref_name }}
          files: hora-do-desenho.apk
          generate_release_notes: true
