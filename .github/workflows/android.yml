name: Android APK

on:
  push:
    branches: [main, "fix/**", "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar Release com esta tag (ex.: v0.2.0). Vazio = só compilar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Validate embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          if "<script>" not in source or "</script>" not in source:
              raise SystemExit("Embedded application script not found")
          script = source.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/hora-do-desenho.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/hora-do-desenho.js

      # Fase zero (APK para parceiros): a chave do YouTube e a assinatura fixa vêm dos secrets
      # do repositório. Sem eles o build continua funcionando, como antes, e só avisa.
      - name: Preparar chave do YouTube e assinatura
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::Sem o secret YOUTUBE_API_KEY: o APK vai pedir a chave do YouTube no passo a passo."
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hora-do-desenho.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/hora-do-desenho.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o secret ANDROID_KEYSTORE_BASE64: o APK sai com assinatura de debug aleatória e, para atualizar, é preciso desinstalar a versão anterior."
          fi

      - name: Build debug APK
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hora-do-desenho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hora-do-desenho-apk
          path: hora-do-desenho.apk

      - name: Publish release (tags v* ou disparo manual com release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Hora do Desenho ${{ inputs.release_tag || github.ref_name }}
          files: hora-do-desenho.apk
          generate_release_notes: true
